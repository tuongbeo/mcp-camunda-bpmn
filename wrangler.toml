name = "camunda-bpmn"
main = "src/cloudflare/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object — one instance per MCP session
[[durable_objects.bindings]]
name = "MCP_BPMN_AGENT"
class_name = "BpmnMcpAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BpmnMcpAgent"]

# KV — persistent BPMN file storage (cross-session)
[[kv_namespaces]]
binding = "BPMN_FILES"
id = "91bb4e456c4b4c1cb266ff9758576663"

[vars]
ENVIRONMENT = "production"
